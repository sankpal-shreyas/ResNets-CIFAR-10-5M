# Teacher for knowledge distillation (not a submission model): WRN-28-10, 36.5M parameters, with
# the students' 800-epoch recipe (TrivialAugment + Cutout, CutMix on half the batches) but no label
# smoothing (it erases the "dark knowledge" distillation relies on; Mueller et al., NeurIPS 2019)
# and no SAM (no gain for the students, twice the cost). Same 45k training split as the students.
base: wrn28_ta.yaml
model:
  name: wrn
  depth: 28
  widths: [160, 320, 640]
enforce_param_limit: false
data:
  cutmix_alpha: 1.0
  mix_prob: 0.5
train:
  epochs: 800
  label_smoothing: 0.0
